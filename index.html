  <meta charset="UTF-8">

  <title>Krisha Dave — Visual Production & Art Direction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Design pixel unit — scales the 1280px design proportionally with viewport
       width with no cap so type/positions stay wall-to-wall on any monitor. */
    :root {
      --u: calc(100vw / 1280);
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Full-bleed video — covers the entire viewport */
    .hero__bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      pointer-events: none;
    }

    /* Nav row — vertically at 67% of viewport height (matches 558/832 from design) */
    .nav {
      position: absolute;
      top: 67.1vh;
      left: 0;
      width: 100%;
    }

    .nav a {
      position: absolute;
      font-family: 'Pixelify Sans', sans-serif;
      font-size: calc(40 * var(--u));
      font-weight: 400;
      color: #ffffff;
      text-decoration: none;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .nav a:hover { opacity: 0.75; }

    /* Horizontal positions as % of viewport width (matches 83/1280, 480/1280, 1058/1280) */
    .nav__photography { left: 6.5%; }
    .nav__creative    { left: 37.5%; }
    .nav__paint       { left: 82.7%; }

    /* Identity block — at 80.2% from top (667/832), centered horizontally */
    .identity {
      position: absolute;
      top: 80.2vh;
      left: 50%;
      transform: translateX(-50%);
      width: calc(849 * var(--u));
      text-align: center;
      font-family: 'Pixelify Sans', sans-serif;
      text-decoration: none;
      display: block;
      cursor: pointer;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }

    .identity:hover { opacity: 0.8; }

    .identity__name {
      font-size: calc(40 * var(--u));
      font-weight: 400;
      color: #000ca9;
      line-height: 1.2;
      display: block;
    }

    .identity__role {
      font-size: calc(24 * var(--u));
      font-weight: 400;
      color: #0900ff;
      line-height: 1.2;
      display: block;
      margin-top: 0.15em;
    }

    .identity__email {
      font-size: calc(24 * var(--u));
      font-weight: 400;
      color: #000ca9;
      line-height: 1.2;
      display: block;
      margin-top: 0.15em;
    }

    @media (max-width: 700px) {
      .hero__bg {
        object-position: center center;
      }

      .nav {
        top: 40.6vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
      }

      .nav a {
        position: static;
        font-size: 24px;
      }

      .nav__photography,
      .nav__creative,
      .nav__paint {
        left: auto;
      }

      .identity {
        top: 64.2vh;
        width: 100%;
        max-width: 402px;
        white-space: normal;
      }

      .identity__name {
        font-size: 24px;
        line-height: 1.15;
      }

      .identity__role,
      .identity__email {
        font-size: 20px;
        line-height: 1.18;
      }

      .identity__role {
        margin-top: 2px;
      }

      .identity__email {
        margin-top: 35px;
      }

    }

  </style>
</head>

  <script>
    const landingVideo = document.querySelector('.hero__bg');

    if (landingVideo) {
      landingVideo.defaultMuted = false;
      landingVideo.muted = false;
      landingVideo.volume = 1;

      const startLandingVideo = () => {
        landingVideo.defaultMuted = false;
        landingVideo.muted = false;
        landingVideo.volume = 1;

        const playPromise = landingVideo.play();
        if (playPromise) {
          playPromise.catch(() => {
            landingVideo.defaultMuted = true;
            landingVideo.muted = true;
            landingVideo.play().catch(() => {});
          });
        }
      };

      const enableLandingAudio = () => {
        landingVideo.defaultMuted = false;
        landingVideo.muted = false;
        landingVideo.volume = 1;
        startLandingVideo();
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startLandingVideo, { once: true });
      } else {
        startLandingVideo();
      }

      landingVideo.addEventListener('loadedmetadata', startLandingVideo, { once: true });
      landingVideo.addEventListener('canplay', startLandingVideo, { once: true });
      window.addEventListener('pointerdown', enableLandingAudio, { once: true });
      window.addEventListener('keydown', enableLandingAudio, { once: true });
    }
  </script>
